<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCKNZ.DEV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --orange: #f58220;
            --bg: #dedede;
            --surface: #ffffff;
            --border: rgba(0,0,0,0.08);
            --text: #1A1A18;
            --muted: #6B6B67;
            --faint: #A8A89F;
            --mono: 'DM Mono', monospace;
            --sans: 'DM Sans', sans-serif;
            --radius: 18px;
        }

        /* Center the entire site in the viewport */
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        nav { width: 100%; padding: 2rem 0 1rem; text-align: center; }
        .logo { font-family: Orbitron; font-size: 24px; text-decoration: none; color: #8a8a8a; letter-spacing: 0.05em; }
        .logo .accent { color: var(--orange); }

        .container {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
        }

        /* 3-Column Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .tile {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.75rem;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 260px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .tile:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Status & Labels */
        .status {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: var(--mono); font-size: 10px; text-transform: uppercase; color: var(--faint);
            margin-bottom: 1rem;
        }
        .status::before { content: ''; width: 6px; height: 6px; background: #4ade80; border-radius: 50%; }
        .label { font-family: var(--mono); font-size: 10px; color: var(--faint); text-transform: uppercase; margin-bottom: 1rem; }

        /* Typography */
        h2 { font-size: 1.5rem; font-weight: 500; margin-bottom: 0.5rem; line-height: 1.2; }
        p { font-size: 0.95rem; color: var(--muted); font-weight: 300; }

        /* Services List */
        .service-list { list-style: none; margin-top: 10px; }
        .service-item { font-size: 14px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .service-item::before { content: "→"; color: var(--orange); }

        /* Contact Tile & Social Icons */
        .tile-contact { background: var(--orange); color: white; border: none; }
        .social-row { display: flex; gap: 15px; margin-top: 20px; }
        .social-link { color: white; opacity: 0.8; transition: opacity 0.2s; }
        .social-link:hover { opacity: 1; }
        .social-link svg { width: 22px; height: 22px; fill: currentColor; }

        /* Project Tiles - All in one row */
        .tile-project {
            padding: 0;
            overflow: hidden;
            background: #cccccc;
            position: relative;
            display: block;
        }
        .project-img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Divider Label */
        .section-label {
            grid-column: 1 / -1;
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--faint);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 2rem 0 0.5rem;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .bento-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
